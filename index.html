<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Circularis • Visualização 3D</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; }

    body {
      min-height: 100vh;
      background: #050f0c;
      color: #ecfdf5;
      overflow-x: hidden;
      position: relative;
    }

    #canvas-3d {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      display: block;
      z-index: 1;
      touch-action: none;
      cursor: grab;
    }

    #canvas-3d:active {
      cursor: grabbing;
    }

    .hud-topo {
      position: fixed;
      top: 16px;
      left: 16px;
      right: 16px;
      z-index: 10;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
      pointer-events: none;
    }

    .hud-titulo {
      background: rgba(8, 26, 20, 0.82);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(101, 214, 155, 0.28);
      border-radius: 12px;
      padding: 12px 16px;
      pointer-events: auto;
    }

    .hud-titulo h1 {
      font-size: 1.05rem;
      font-weight: 800;
      color: #65d69b;
    }

    .hud-titulo p {
      font-size: 0.78rem;
      color: #a7f3d0;
      margin-top: 2px;
    }

    .etiquetas-flutuantes {
      position: fixed;
      bottom: 16px;
      left: 16px;
      right: 16px;
      z-index: 10;
      display: flex;
      gap: 10px;
      overflow-x: auto;
      padding-bottom: 6px;
      pointer-events: auto;
    }

    .tag-3d {
      min-width: 210px;
      background: rgba(8, 26, 20, 0.86);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-top: 4px solid #2e7d32;
      border-radius: 12px;
      padding: 10px 14px;
      flex-shrink: 0;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.45);
    }

    .tag-3d.destaque {
      border-color: rgba(101, 214, 155, 0.55);
      background: rgba(13, 46, 35, 0.92);
    }

    .tag-linha-1 {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.74rem;
      font-weight: 800;
      color: #6ee7b7;
      margin-bottom: 4px;
    }

    .tag-nome {
      font-size: 0.92rem;
      font-weight: 800;
      color: #ffffff;
      margin-bottom: 3px;
    }

    .tag-valor {
      font-size: 0.8rem;
      font-weight: 700;
      color: #34d399;
    }

    .tag-detalhe {
      font-size: 0.72rem;
      color: #cbd5e1;
      margin-top: 3px;
    }

    .sem-dados {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 20;
      background: rgba(8, 26, 20, 0.94);
      border: 1px solid rgba(101, 214, 155, 0.35);
      border-radius: 14px;
      padding: 22px;
      max-width: 360px;
      width: 90%;
      text-align: center;
      display: none;
    }
  </style>
</head>
<body>
  <canvas id="canvas-3d"></canvas>

  <div class="hud-topo">
    <div class="hud-titulo">
      <h1 id="titulo-3d">Visualização 3D</h1>
      <p id="subtitulo-3d">Arraste para girar • Dados da tabela</p>
    </div>
  </div>

  <div id="etiquetas-container" class="etiquetas-flutuantes"></div>

  <div id="sem-dados" class="sem-dados">
    <p style="font-weight:700; margin-bottom:8px;">Nenhum dado recebido pelo QR Code.</p>
    <p style="font-size:0.82rem; color:#a7f3d0;">Gere um novo QR Code na tela de Métricas para carregar os valores da tabela.</p>
  </div>

  <script>
    const CORES = [0x10b981, 0x059669, 0x0284c7, 0x84cc16, 0x14b8a6, 0x34d399];
    const CORES_HEX = ['#10b981', '#059669', '#0284c7', '#84cc16', '#14b8a6', '#34d399'];

    function obterDadosTabela() {
      const params = new URLSearchParams(window.location.search);
      const raw = params.get('grafico');
      if (!raw) return null;

      try {
        const parsed = JSON.parse(raw);
        const lista = Array.isArray(parsed.i) ? parsed.i : (Array.isArray(parsed.itens) ? parsed.itens : []);
        return {
          titulo: parsed.t || parsed.titulo || 'Ranking 3D',
          tipo: parsed.tp || parsed.tipo || 'industria',
          itens: lista.map((it, idx) => ({
            pos: it.p ?? it.pos ?? (idx + 1),
            nome: it.n || it.nome || `Item ${idx + 1}`,
            score: Number(it.s ?? it.score ?? 0),
            valor: it.v || it.valorPrincipalFmt || '',
            detalhe: it.d || it.detalheExtra || ''
          }))
        };
      } catch (e) {
        console.error('Erro ao interpretar dados da tabela:', e);
        return null;
      }
    }

    function criarEtiquetaSprite(titulo, subtitulo, corHex) {
      const canvas = document.createElement('canvas');
      canvas.width = 512;
      canvas.height = 150;
      const ctx = canvas.getContext('2d');

      ctx.fillStyle = 'rgba(7, 24, 18, 0.92)';
      ctx.beginPath();
      ctx.roundRect(10, 10, 492, 130, 20);
      ctx.fill();

      ctx.lineWidth = 5;
      ctx.strokeStyle = corHex;
      ctx.stroke();

      ctx.fillStyle = '#ffffff';
      ctx.font = 'bold 32px Arial';
      ctx.fillText(titulo.slice(0, 22), 28, 56);

      ctx.fillStyle = '#6ee7b7';
      ctx.font = 'bold 26px Arial';
      ctx.fillText(subtitulo.slice(0, 26), 28, 102);

      const tex = new THREE.CanvasTexture(canvas);
      const mat = new THREE.SpriteMaterial({ map: tex, transparent: true });
      const sprite = new THREE.Sprite(mat);
      sprite.scale.set(2.6, 0.76, 1);
      return sprite;
    }

    function renderizarEtiquetasHUD(itens) {
      const container = document.getElementById('etiquetas-container');
      container.innerHTML = itens.map((item, idx) => {
        const cor = CORES_HEX[idx % CORES_HEX.length];
        return `
          <div class="tag-3d ${idx === 0 ? 'destaque' : ''}" style="border-top-color:${cor};">
            <div class="tag-linha-1">
              <span>#${item.pos ?? (idx + 1)}</span>
              <span>${item.score} pts</span>
            </div>
            <div class="tag-nome">${item.nome}</div>
            ${item.valor ? `<div class="tag-valor">${item.valor}</div>` : ''}
            ${item.detalhe ? `<div class="tag-detalhe">${item.detalhe}</div>` : ''}
          </div>
        `;
      }).join('');
    }

    function iniciarCena3D(itens) {
      const canvas = document.getElementById('canvas-3d');
      const scene = new THREE.Scene();

      const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
      camera.position.set(0, 4.2, 5.8);
      camera.lookAt(0, 0, 0);

      const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));

      scene.add(new THREE.AmbientLight(0xffffff, 0.8));
      const luz = new THREE.DirectionalLight(0xa7f3d0, 1.0);
      luz.position.set(4, 8, 5);
      scene.add(luz);

      const grupo = new THREE.Group();
      scene.add(grupo);

      const soma = itens.reduce((acc, it) => acc + Math.max(Number(it.score) || 0, 0.1), 0);
      let angulo = 0;
      const raio = 1.8;

      itens.forEach((item, idx) => {
        const val = Math.max(Number(item.score) || 0, 0.1);
        const fatia = (val / soma) * Math.PI * 2;
        const corNum = CORES[idx % CORES.length];
        const corHex = CORES_HEX[idx % CORES_HEX.length];

        const forma = new THREE.Shape();
        forma.moveTo(0, 0);
        forma.absarc(0, 0, raio, angulo, angulo + fatia, false);
        forma.lineTo(0, 0);

        const geo = new THREE.ExtrudeGeometry(forma, {
          depth: 0.6,
          bevelEnabled: true,
          bevelSegments: 2,
          steps: 1,
          bevelSize: 0.03,
          bevelThickness: 0.03
        });
        geo.rotateX(-Math.PI / 2);

        const mat = new THREE.MeshStandardMaterial({
          color: corNum,
          roughness: 0.3,
          metalness: 0.2
        });

        const fatiaMesh = new THREE.Mesh(geo, mat);
        const meio = angulo + fatia / 2;
        const offset = idx === 0 ? 0.2 : 0.05;
        fatiaMesh.position.x = Math.cos(meio) * offset;
        fatiaMesh.position.z = Math.sin(meio) * offset;
        grupo.add(fatiaMesh);

        const sprite = criarEtiquetaSprite(
          `#${item.pos ?? (idx + 1)} ${item.nome}`,
          `${item.score} pts${item.valor ? ' • ' + item.valor : ''}`,
          corHex
        );
        sprite.position.set(
          Math.cos(meio) * (raio + 0.9),
          0.95 + (idx % 2) * 0.3,
          Math.sin(meio) * (raio + 0.9)
        );
        grupo.add(sprite);

        angulo += fatia;
      });

      let arrastando = false;
      let prevX = 0;
      let prevY = 0;

      canvas.addEventListener('pointerdown', (e) => {
        arrastando = true;
        prevX = e.clientX;
        prevY = e.clientY;
      });

      window.addEventListener('pointerup', () => {
        arrastando = false;
      });

      window.addEventListener('pointermove', (e) => {
        if (!arrastando) return;
        grupo.rotation.y += (e.clientX - prevX) * 0.01;
        grupo.rotation.x = Math.max(-0.5, Math.min(0.6, grupo.rotation.x + (e.clientY - prevY) * 0.008));
        prevX = e.clientX;
        prevY = e.clientY;
      });

      window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      });

      function loop() {
        requestAnimationFrame(loop);
        if (!arrastando) grupo.rotation.y += 0.004;
        renderer.render(scene, camera);
      }
      loop();
    }

    window.addEventListener('DOMContentLoaded', () => {
      const dados = obterDadosTabela();
      if (!dados || !dados.itens.length) {
        document.getElementById('sem-dados').style.display = 'block';
        return;
      }

      const ordenados = [...dados.itens].sort((a, b) => Number(b.score) - Number(a.score));
      document.getElementById('titulo-3d').innerText = dados.titulo;
      document.getElementById('subtitulo-3d').innerText =
        dados.tipo === 'cooperativa' ? 'Cooperativas • Conforme a tabela' : 'Fornecedores • Conforme a tabela';

      iniciarCena3D(ordenados);
      renderizarEtiquetasHUD(ordenados);
    });
  </script>
</body>
</html>
