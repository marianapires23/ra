<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Circularis • Gráfico 3D</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; }

    html, body {
      min-height: 100dvh;
      width: 100%;
      background: #0b2920;
      color: #ffffff;
      overflow-x: hidden;
    }

    #canvas-3d {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100dvh;
      display: block;
      z-index: 1;
      touch-action: none;
      cursor: pointer;
    }

    .camada-ui {
      position: relative;
      z-index: 2;
      min-height: 100dvh;
      padding: clamp(10px, 2.8vw, 20px);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 10px;
      pointer-events: none;
    }

    .topo-painel {
      display: flex;
      flex-direction: column;
      gap: 8px;
      max-width: min(100%, 440px);
      pointer-events: auto;
    }

    .cabecalho-card {
      background: rgba(255, 255, 255, 0.95);
      color: #071f18;
      padding: 10px 14px;
      border-radius: 12px;
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.24);
    }

    .cabecalho-card h1 {
      font-size: clamp(0.95rem, 3.8vw, 1.12rem);
      font-weight: 800;
      color: #071f18;
    }

    .cabecalho-card p {
      font-size: clamp(0.72rem, 2.8vw, 0.78rem);
      color: #2e7d32;
      font-weight: 700;
      margin-top: 2px;
    }

    .painel-barras {
      background: rgba(255, 255, 255, 0.93);
      color: #071f18;
      padding: 9px 14px;
      border-radius: 12px;
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.22);
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .barra-linha {
      display: grid;
      grid-template-columns: 88px 1fr 42px;
      align-items: center;
      gap: 8px;
      font-size: 0.74rem;
      font-weight: 700;
    }

    .barra-linha input[type="range"] {
      width: 100%;
      accent-color: #2e7d32;
      cursor: pointer;
    }

    .barra-valor {
      text-align: right;
      color: #15803d;
      font-weight: 800;
    }

    .rodape-ui {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      pointer-events: auto;
    }

    /* Indicador compacto para identificar cada fatia na tela do celular */
    .indicador-fatias {
      width: min(100%, 440px);
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 2px;
      scrollbar-width: none;
    }

    .indicador-fatias::-webkit-scrollbar {
      display: none;
    }

    .chip-fatia {
      flex: 0 0 auto;
      display: inline-flex;
      align-items: center;
      gap: 7px;
      background: rgba(7, 31, 24, 0.88);
      color: #ffffff;
      border: 1px solid rgba(255, 255, 255, 0.16);
      border-radius: 999px;
      padding: 6px 11px;
      font-size: 0.72rem;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.15s ease, border-color 0.15s ease;
    }

    .chip-fatia.ativo {
      border-color: #86efac;
      background: rgba(20, 83, 45, 0.95);
      transform: translateY(-1px);
    }

    .ponto-cor {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      flex-shrink: 0;
      border: 1px solid rgba(255, 255, 255, 0.6);
    }

    .dica-toque {
      background: rgba(7, 31, 24, 0.84);
      color: #d1fae5;
      border: 1px solid rgba(167, 243, 208, 0.25);
      padding: 5px 13px;
      border-radius: 999px;
      font-size: clamp(0.7rem, 2.7vw, 0.78rem);
      font-weight: 600;
    }

    .etiqueta-detalhes {
      width: min(100%, 440px);
      background: rgba(255, 255, 255, 0.98);
      color: #071f18;
      border-radius: 14px;
      border-top: 5px solid #2e7d32;
      padding: 13px 15px;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.42);
      display: none;
    }

    .etq-topo {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      margin-bottom: 5px;
    }

    .etq-pos {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 0.72rem;
      font-weight: 800;
      color: #0f4033;
      text-transform: uppercase;
    }

    .etq-dir {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .etq-score {
      background: #e8f5e9;
      color: #1b5e20;
      font-weight: 800;
      font-size: 0.78rem;
      padding: 2px 8px;
      border-radius: 6px;
    }

    .btn-fechar {
      background: #e5e7eb;
      color: #111827;
      border: none;
      width: 24px;
      height: 24px;
      border-radius: 999px;
      font-weight: 800;
      font-size: 0.8rem;
      cursor: pointer;
    }

    .etq-nome {
      font-size: clamp(0.96rem, 3.9vw, 1.1rem);
      font-weight: 800;
      color: #071f18;
      margin-bottom: 8px;
    }

    .etq-grade {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px 10px;
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 10px;
      padding: 10px;
      font-size: clamp(0.74rem, 2.9vw, 0.82rem);
    }

    .etq-campo-full {
      grid-column: 1 / -1;
    }

    .etq-rotulo {
      color: #64748b;
      font-size: 0.66rem;
      font-weight: 700;
      text-transform: uppercase;
      display: block;
    }

    .etq-dado {
      color: #071f18;
      font-weight: 700;
    }

    .etq-dado-destaque {
      color: #15803d;
      font-weight: 800;
    }

    .aviso-vazio {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 5;
      width: min(88vw, 340px);
      background: rgba(255, 255, 255, 0.96);
      color: #071f18;
      padding: 18px;
      border-radius: 12px;
      text-align: center;
      font-size: 0.85rem;
      font-weight: 600;
      display: none;
    }
  </style>
</head>
<body>
  <canvas id="canvas-3d"></canvas>

  <div class="camada-ui">
    <div class="topo-painel">
      <header class="cabecalho-card">
        <h1 id="titulo-grafico">Gráfico 3D</h1>
        <p id="subtitulo-grafico">Arraste para girar • Toque numa fatia para ver os dados da tabela</p>
      </header>

      <section id="painel-barras" class="painel-barras" style="display:none;">
        <div class="barra-linha">
          <span>💰 Preço</span>
          <input type="range" id="sl-preco" min="0" max="100" value="50" oninput="recalcularEAtualizar()">
          <span class="barra-valor" id="lbl-preco">50%</span>
        </div>
        <div class="barra-linha">
          <span>📍 Distância</span>
          <input type="range" id="sl-dist" min="0" max="100" value="30" oninput="recalcularEAtualizar()">
          <span class="barra-valor" id="lbl-dist">30%</span>
        </div>
        <div class="barra-linha" id="linha-avaliacao">
          <span>⭐ Avaliação</span>
          <input type="range" id="sl-aval" min="0" max="100" value="20" oninput="recalcularEAtualizar()">
          <span class="barra-valor" id="lbl-aval">20%</span>
        </div>
      </section>
    </div>

    <div class="rodape-ui">
      <div id="indicador-fatias" class="indicador-fatias"></div>
      <div id="dica-toque" class="dica-toque">Toque em uma fatia ou indicador para ver os dados da tabela</div>

      <aside id="etiqueta-detalhes" class="etiqueta-detalhes" aria-live="polite">
        <div class="etq-topo">
          <span id="etq-pos" class="etq-pos">
            <span id="etq-cor" class="ponto-cor"></span>
            <span id="etq-pos-texto">#1</span>
          </span>
          <div class="etq-dir">
            <span id="etq-score" class="etq-score">0 pts</span>
            <button type="button" class="btn-fechar" onclick="fecharEtiqueta()" aria-label="Fechar">✕</button>
          </div>
        </div>
        <div id="etq-nome" class="etq-nome"></div>
        <div id="etq-grade" class="etq-grade"></div>
      </aside>
    </div>
  </div>

  <div id="aviso-vazio" class="aviso-vazio">
    Nenhum dado recebido pelo QR Code. Gere o QR Code na tela de Métricas.
  </div>

  <script>
    const CORES_3D = [0x1b5e20, 0x388e3c, 0x66bb6a, 0x0288d1, 0x00897b, 0x8bc34a];
    const CORES_CSS = ['#1b5e20', '#388e3c', '#66bb6a', '#0288d1', '#00897b', '#8bc34a'];

    let dadosBase = null;
    let itensAnalisadosAtuais = [];
    let itemAtivoIdx = null;
    let meshesFatia = [];
    let scene, camera, renderer, grupoPizza;
    let arrastando = false, moveuDuranteArraste = false;
    let inicioX = 0, inicioY = 0, ultimoX = 0, ultimoY = 0;

    function extrairNumeroMoeda(texto) {
      if (typeof texto === 'number') return Number.isFinite(texto) ? texto : 0;
      if (!texto) return 0;
      const limpo = String(texto)
        .replace(/[^\d,.-]/g, '')
        .replace(/\.(?=\d{3}(?:[^\d]|$))/g, '')
        .replace(',', '.');
      const num = Number(limpo);
      return Number.isFinite(num) ? num : 0;
    }

    function extrairDistancia(item) {
      if (item.distanciaKm !== '' && item.distanciaKm !== null && item.distanciaKm !== undefined) {
        const n = Number(item.distanciaKm);
        if (Number.isFinite(n)) return n;
      }
      const m = String(item.detalhe || '').match(/([\d.,]+)\s*km/i);
      if (m) return extrairNumeroMoeda(m[1]);
      return 0;
    }

    function extrairAvaliacao(item) {
      if (item.avaliacao !== '' && item.avaliacao !== null && item.avaliacao !== undefined) {
        const n = Number(item.avaliacao);
        if (Number.isFinite(n)) return n;
      }
      const m = String(item.detalhe || '').match(/⭐\s*([\d.,]+)/);
      if (m) return extrairNumeroMoeda(m[1]);
      return 0;
    }

    function extrairPreco(item) {
      if (item.precoFmt) return item.precoFmt;
      const m = String(item.detalhe || '').match(/Preço:\s*([^•]+)/i);
      return m ? m[1].trim() : '';
    }

    function lerDadosTabelaURL() {
      const params = new URLSearchParams(window.location.search);
      const raw = params.get('grafico');
      if (!raw) return null;

      try {
        const parsed = JSON.parse(raw);
        const lista = Array.isArray(parsed.i) ? parsed.i : (Array.isArray(parsed.itens) ? parsed.itens : []);
        const tituloGeral = parsed.t || parsed.titulo || 'Ranking 3D';
        const produtoPadrao = tituloGeral.replace(/^Produto:\s*/i, '').trim();

        return {
          titulo: tituloGeral,
          tipo: parsed.tp || parsed.tipo || 'industria',
          pesos: parsed.w || null,
          itens: lista.map((it, idx) => ({
            pos: it.p ?? it.pos ?? (idx + 1),
            nome: it.n || it.nome || `Item ${idx + 1}`,
            produto: it.pr || it.produto || produtoPadrao,
            precoFmt: it.prc || '',
            scoreOriginal: Number(it.s ?? it.score ?? 0),
            valor: it.v || it.valorPrincipalFmt || '',
            detalhe: it.d || it.detalheExtra || '',
            distanciaKm: it.km ?? it.distanciaKm ?? '',
            avaliacao: it.av ?? it.avaliacao ?? ''
          }))
        };
      } catch (e) {
        console.error('Erro ao ler dados da tabela:', e);
        return null;
      }
    }

    function calcularItensComParametros(itens, tipo, pesos) {
      if (!itens.length) return [];

      const valoresNum = itens.map(extrairNumeroMoeda);
      const distsNum = itens.map(extrairDistancia);
      const avalsNum = itens.map(extrairAvaliacao);

      const temVariacaoValor = new Set(valoresNum).size > 1;
      const temVariacaoDist = new Set(distsNum).size > 1;
      const temVariacaoAval = new Set(avalsNum).size > 1;

      const minVal = Math.min(...valoresNum), maxVal = Math.max(...valoresNum);
      const minDist = Math.min(...distsNum), maxDist = Math.max(...distsNum);
      const minAval = Math.min(...avalsNum), maxAval = Math.max(...avalsNum);

      const pPreco = Number(pesos.preco ?? 50);
      const pDist = Number(pesos.distancia ?? 30);
      const pAval = tipo === 'cooperativa' ? 0 : Number(pesos.avaliacao ?? 20);
      const somaPesos = (pPreco + pDist + pAval) || 100;

      const calculados = itens.map((item, i) => {
        const sVal = maxVal === minVal ? 100 : ((maxVal - valoresNum[i]) / (maxVal - minVal)) * 100;
        const sDist = maxDist === minDist ? 100 : ((maxDist - distsNum[i]) / (maxDist - minDist)) * 100;
        const sAval = maxAval === minAval ? 100 : ((avalsNum[i] - minAval) / (maxAval - minAval)) * 100;

        const podeRecalcular = temVariacaoValor || temVariacaoDist || temVariacaoAval;
        const scoreCalculado = podeRecalcular
          ? Number((((sVal * pPreco) + (sDist * pDist) + (sAval * pAval)) / somaPesos).toFixed(1))
          : Number(item.scoreOriginal || 0);

        return {
          ...item,
          scoreFinal: scoreCalculado,
          distNum: distsNum[i],
          avalNum: avalsNum[i],
          precoTexto: extrairPreco(item)
        };
      });

      const ordenados = calculados.sort((a, b) => b.scoreFinal - a.scoreFinal);
      const somaScoresPositivos = ordenados.reduce((acc, it) => acc + Math.max(0, it.scoreFinal), 0);
      const baseProporcao = somaScoresPositivos > 0 ? somaScoresPositivos : ordenados.length;

      return ordenados.map((item, idx) => {
        const pesoFatia = somaScoresPositivos > 0 ? Math.max(0, item.scoreFinal) : 1;
        const participacaoPct = ((pesoFatia / baseProporcao) * 100).toFixed(1);
        return {
          ...item,
          posTabela: idx + 1,
          pesoFatia,
          participacaoPct
        };
      });
    }

    function renderizarIndicadorFatias(itensAnalisados) {
      const box = document.getElementById('indicador-fatias');
      if (!box) return;

      box.innerHTML = itensAnalisados.map((item, idx) => {
        const cor = CORES_CSS[idx % CORES_CSS.length];
        const ativo = itemAtivoIdx === idx ? 'ativo' : '';
        return `
          <button type="button" class="chip-fatia ${ativo}" onclick="mostrarEtiquetaPorIndice(${idx})">
            <span class="ponto-cor" style="background:${cor};"></span>
            <span>#${item.posTabela} ${item.nome} • ${item.scoreFinal} pts</span>
          </button>
        `;
      }).join('');
    }

    function fecharEtiqueta() {
      itemAtivoIdx = null;
      document.getElementById('etiqueta-detalhes').style.display = 'none';
      document.getElementById('dica-toque').style.display = 'block';
      meshesFatia.forEach((m) => {
        m.position.x = m.userData.baseX;
        m.position.z = m.userData.baseZ;
      });
      renderizarIndicadorFatias(itensAnalisadosAtuais);
    }

    function mostrarEtiquetaPorIndice(idx) {
      const item = itensAnalisadosAtuais[idx];
      if (!item || !dadosBase) return;
      mostrarEtiquetaItem(item, idx, dadosBase.tipo);
    }

    function mostrarEtiquetaItem(item, idx, tipo) {
      itemAtivoIdx = idx;
      const corCss = CORES_CSS[idx % CORES_CSS.length];
      const box = document.getElementById('etiqueta-detalhes');
      const grade = document.getElementById('etq-grade');

      box.style.borderTopColor = corCss;
      box.style.display = 'block';
      document.getElementById('dica-toque').style.display = 'none';

      document.getElementById('etq-cor').style.background = corCss;
      document.getElementById('etq-pos-texto').innerText =
        `#${item.posTabela} • ${tipo === 'cooperativa' ? 'Cooperativa' : 'Fornecedor'}`;
      document.getElementById('etq-score').innerText = `${item.scoreFinal} pts (${item.participacaoPct}%)`;
      document.getElementById('etq-nome').innerText = item.nome;

      const rotuloValor = tipo === 'cooperativa' ? 'Custo Total Estimado' : 'Orçamento Total';
      const distExibida = item.distNum > 0
        ? `${item.distNum} km`
        : (item.distanciaKm !== '' && item.distanciaKm !== null && item.distanciaKm !== undefined ? `${item.distanciaKm} km` : '—');

      const celulas = [];

      if (item.produto) {
        celulas.push(`<div><span class="etq-rotulo">Produto / Item</span><span class="etq-dado">${item.produto}</span></div>`);
      }

      celulas.push(`<div><span class="etq-rotulo">${rotuloValor}</span><span class="etq-dado-destaque">${item.valor || '—'}</span></div>`);

      if (item.precoTexto) {
        celulas.push(`<div><span class="etq-rotulo">Preço Unitário</span><span class="etq-dado">${item.precoTexto}</span></div>`);
      }

      celulas.push(`<div><span class="etq-rotulo">Distância</span><span class="etq-dado">${distExibida}</span></div>`);

      if (tipo !== 'cooperativa' && (item.avalNum > 0 || item.avaliacao !== '')) {
        celulas.push(`<div><span class="etq-rotulo">Avaliação</span><span class="etq-dado">⭐ ${item.avalNum || item.avaliacao}</span></div>`);
      }

      if (item.detalhe) {
        celulas.push(`<div class="etq-campo-full"><span class="etq-rotulo">Detalhes da Tabela</span><span class="etq-dado">${item.detalhe}</span></div>`);
      }

      grade.innerHTML = celulas.join('');

      meshesFatia.forEach((m, mIdx) => {
        const destaque = mIdx === idx ? 0.24 : 0;
        m.position.x = m.userData.baseX + Math.cos(m.userData.anguloMeio) * destaque;
        m.position.z = m.userData.baseZ - Math.sin(m.userData.anguloMeio) * destaque;
      });

      renderizarIndicadorFatias(itensAnalisadosAtuais);
    }

    function reconstruirFatias3D(itensAnalisados, tipo) {
      if (!grupoPizza) return;
      while (grupoPizza.children.length > 0) {
        grupoPizza.remove(grupoPizza.children[0]);
      }
      meshesFatia = [];

      const totalPeso = itensAnalisados.reduce((acc, it) => acc + it.pesoFatia, 0) || 1;
      let anguloAtual = 0;
      const raio = 1.72;

      itensAnalisados.forEach((item, idx) => {
        const anguloFatia = (item.pesoFatia / totalPeso) * Math.PI * 2;
        const corHex = CORES_3D[idx % CORES_3D.length];

        const forma = new THREE.Shape();
        forma.moveTo(0, 0);
        forma.absarc(0, 0, raio, anguloAtual, anguloAtual + anguloFatia, false);
        forma.lineTo(0, 0);

        const geo = new THREE.ExtrudeGeometry(forma, {
          depth: 0.56,
          bevelEnabled: true,
          bevelSegments: 2,
          steps: 1,
          bevelSize: 0.025,
          bevelThickness: 0.025
        });
        geo.rotateX(-Math.PI / 2);

        const mat = new THREE.MeshStandardMaterial({
          color: corHex,
          roughness: 0.35,
          metalness: 0.15
        });

        const fatiaMesh = new THREE.Mesh(geo, mat);
        const anguloMeio = anguloAtual + anguloFatia / 2;
        const baseX = Math.cos(anguloMeio) * 0.05;
        const baseZ = -Math.sin(anguloMeio) * 0.05;

        fatiaMesh.position.x = baseX;
        fatiaMesh.position.z = baseZ;
        fatiaMesh.userData = { item, idx, baseX, baseZ, anguloMeio };

        grupoPizza.add(fatiaMesh);
        meshesFatia.push(fatiaMesh);

        anguloAtual += anguloFatia;
      });

      renderizarIndicadorFatias(itensAnalisados);

      if (itemAtivoIdx !== null && itensAnalisados[itemAtivoIdx]) {
        mostrarEtiquetaItem(itensAnalisados[itemAtivoIdx], itemAtivoIdx, tipo);
      }
    }

    function ajustarProporcaoTela() {
      if (!camera || !renderer) return;
      const w = window.innerWidth;
      const h = window.innerHeight;
      const ehCelular = w < 640;

      camera.aspect = w / h;
      camera.updateProjectionMatrix();
      renderer.setSize(w, h);

      if (ehCelular) {
        camera.position.set(0, 5.4, 7.6);
      } else {
        camera.position.set(0, 4.3, 5.9);
      }
      camera.lookAt(0, -0.15, 0);
    }

    function iniciarCena3D() {
      const canvas = document.getElementById('canvas-3d');
      scene = new THREE.Scene();
      camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
      renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
      renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));

      ajustarProporcaoTela();

      scene.add(new THREE.AmbientLight(0xffffff, 0.85));
      const luzDirecional = new THREE.DirectionalLight(0xffffff, 0.85);
      luzDirecional.position.set(4, 7, 5);
      scene.add(luzDirecional);

      grupoPizza = new THREE.Group();
      scene.add(grupoPizza);

      const raycaster = new THREE.Raycaster();
      const ponteiro = new THREE.Vector2();

      canvas.addEventListener('pointerdown', (e) => {
        arrastando = true;
        moveuDuranteArraste = false;
        inicioX = ultimoX = e.clientX;
        inicioY = ultimoY = e.clientY;
      });

      window.addEventListener('pointermove', (e) => {
        if (!arrastando) return;
        const dx = e.clientX - ultimoX;
        const dy = e.clientY - ultimoY;
        if (Math.hypot(e.clientX - inicioX, e.clientY - inicioY) > 6) {
          moveuDuranteArraste = true;
        }
        ultimoX = e.clientX;
        ultimoY = e.clientY;

        grupoPizza.rotation.y += dx * 0.01;
        grupoPizza.rotation.x = Math.max(-0.45, Math.min(0.55, grupoPizza.rotation.x + dy * 0.008));
      });

      window.addEventListener('pointerup', (e) => {
        if (!arrastando) return;
        arrastando = false;

        if (!moveuDuranteArraste) {
          const rect = canvas.getBoundingClientRect();
          ponteiro.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
          ponteiro.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;

          raycaster.setFromCamera(ponteiro, camera);
          const hits = raycaster.intersectObjects(meshesFatia, false);

          if (hits.length > 0) {
            const clicado = hits[0].object.userData;
            mostrarEtiquetaItem(clicado.item, clicado.idx, dadosBase.tipo);
          } else {
            fecharEtiqueta();
          }
        }
      });

      window.addEventListener('resize', ajustarProporcaoTela);

      function animar() {
        requestAnimationFrame(animar);
        if (!arrastando && itemAtivoIdx === null) {
          grupoPizza.rotation.y += 0.005;
        }
        renderer.render(scene, camera);
      }
      animar();
    }

    function recalcularEAtualizar() {
      if (!dadosBase) return;
      const pPreco = Number(document.getElementById('sl-preco')?.value ?? 50);
      const pDist = Number(document.getElementById('sl-dist')?.value ?? 30);
      const pAval = Number(document.getElementById('sl-aval')?.value ?? 20);

      document.getElementById('lbl-preco').innerText = `${pPreco}%`;
      document.getElementById('lbl-dist').innerText = `${pDist}%`;
      document.getElementById('lbl-aval').innerText = `${pAval}%`;

      itensAnalisadosAtuais = calcularItensComParametros(
        dadosBase.itens,
        dadosBase.tipo,
        { preco: pPreco, distancia: pDist, avaliacao: pAval }
      );

      reconstruirFatias3D(itensAnalisadosAtuais, dadosBase.tipo);
    }

    window.addEventListener('DOMContentLoaded', () => {
      dadosBase = lerDadosTabelaURL();
      if (!dadosBase || !dadosBase.itens.length) {
        document.getElementById('aviso-vazio').style.display = 'block';
        document.getElementById('dica-toque').style.display = 'none';
        return;
      }

      const ehCoop = dadosBase.tipo === 'cooperativa';
      document.getElementById('titulo-grafico').innerText = dadosBase.titulo;
      document.getElementById('subtitulo-grafico').innerText =
        ehCoop ? 'Cooperativas • Parâmetros da tabela' : 'Fornecedores • Parâmetros da tabela';

      const painelBarras = document.getElementById('painel-barras');
      painelBarras.style.display = 'flex';
      if (ehCoop) {
        document.getElementById('linha-avaliacao').style.display = 'none';
      }

      if (dadosBase.pesos) {
        if (dadosBase.pesos.p !== undefined) document.getElementById('sl-preco').value = dadosBase.pesos.p;
        if (dadosBase.pesos.d !== undefined) document.getElementById('sl-dist').value = dadosBase.pesos.d;
        if (dadosBase.pesos.a !== undefined) document.getElementById('sl-aval').value = dadosBase.pesos.a;
      }

      iniciarCena3D();
      recalcularEAtualizar();
    });
  </script>
</body>
</html>
