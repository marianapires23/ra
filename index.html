<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Circularis • Gráfico 3D</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; }

    html, body {
      height: 100dvh;
      width: 100%;
      background: #0b2920;
      color: #ffffff;
      overflow: hidden;
    }

    .tela-3d {
      position: relative;
      width: 100%;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: clamp(12px, 3vw, 24px);
    }

    #canvas-3d {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100dvh;
      display: block;
      z-index: 1;
      touch-action: none;
      cursor: pointer;
    }

    .topo-limpo {
      position: relative;
      z-index: 2;
      align-self: flex-start;
      max-width: min(92vw, 420px);
      background: rgba(255, 255, 255, 0.94);
      color: #071f18;
      padding: 10px 14px;
      border-radius: 12px;
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.22);
    }

    .topo-limpo h1 {
      font-size: clamp(0.95rem, 3.8vw, 1.15rem);
      font-weight: 800;
      line-height: 1.25;
      color: #071f18;
    }

    .topo-limpo p {
      font-size: clamp(0.72rem, 2.8vw, 0.8rem);
      color: #2e7d32;
      font-weight: 700;
      margin-top: 2px;
    }

    .dica-toque {
      position: relative;
      z-index: 2;
      align-self: center;
      background: rgba(7, 31, 24, 0.82);
      color: #d1fae5;
      border: 1px solid rgba(167, 243, 208, 0.25);
      padding: 6px 14px;
      border-radius: 999px;
      font-size: clamp(0.72rem, 2.8vw, 0.8rem);
      font-weight: 600;
      pointer-events: none;
    }

    .etiqueta-selecionada {
      position: fixed;
      left: 50%;
      bottom: clamp(14px, 3.5vw, 26px);
      transform: translateX(-50%);
      z-index: 10;
      width: min(92vw, 420px);
      background: rgba(255, 255, 255, 0.97);
      color: #071f18;
      border-radius: 14px;
      border-top: 5px solid #2e7d32;
      padding: 14px 16px;
      box-shadow: 0 12px 28px rgba(0, 0, 0, 0.38);
      display: none;
    }

    .etiqueta-topo {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      margin-bottom: 6px;
    }

    .etiqueta-pos {
      font-size: 0.75rem;
      font-weight: 800;
      color: #0f4033;
      text-transform: uppercase;
    }

    .etiqueta-acoes {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .etiqueta-score {
      background: #e8f5e9;
      color: #1b5e20;
      font-weight: 800;
      font-size: 0.8rem;
      padding: 2px 8px;
      border-radius: 6px;
    }

    .btn-fechar-etiqueta {
      background: #e5e7eb;
      color: #111827;
      border: none;
      width: 24px;
      height: 24px;
      border-radius: 999px;
      font-weight: 800;
      font-size: 0.8rem;
      cursor: pointer;
      line-height: 1;
    }

    .etiqueta-nome {
      font-size: clamp(0.98rem, 4vw, 1.12rem);
      font-weight: 800;
      color: #071f18;
      margin-bottom: 8px;
    }

    .etiqueta-linhas {
      display: flex;
      flex-direction: column;
      gap: 4px;
      font-size: clamp(0.78rem, 3.1vw, 0.86rem);
      color: #1f2937;
    }

    .etiqueta-linha-destaque {
      font-weight: 800;
      color: #15803d;
    }

    .aviso-vazio {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 5;
      width: min(88vw, 340px);
      background: rgba(255, 255, 255, 0.96);
      color: #071f18;
      padding: 18px;
      border-radius: 12px;
      text-align: center;
      font-size: 0.85rem;
      font-weight: 600;
      display: none;
    }
  </style>
</head>
<body>
  <canvas id="canvas-3d"></canvas>

  <div class="tela-3d">
    <header class="topo-limpo">
      <h1 id="titulo-grafico">Gráfico 3D</h1>
      <p id="subtitulo-grafico">Toque em uma fatia para ver os dados da tabela</p>
    </header>

    <div id="dica-toque" class="dica-toque">Toque no gráfico 3D para abrir a etiqueta completa</div>
  </div>

  <aside id="etiqueta-selecionada" class="etiqueta-selecionada" aria-live="polite">
    <div class="etiqueta-topo">
      <span id="etq-pos" class="etiqueta-pos">#1</span>
      <div class="etiqueta-acoes">
        <span id="etq-score" class="etiqueta-score">0 pts</span>
        <button type="button" class="btn-fechar-etiqueta" onclick="fecharEtiqueta()" aria-label="Fechar etiqueta">✕</button>
      </div>
    </div>
    <div id="etq-nome" class="etiqueta-nome"></div>
    <div id="etq-linhas" class="etiqueta-linhas"></div>
  </aside>

  <div id="aviso-vazio" class="aviso-vazio">
    Nenhum dado recebido pelo QR Code. Gere o QR Code na tela de Métricas.
  </div>

  <script>
    const CORES_3D = [0x1b5e20, 0x2e7d32, 0x43a047, 0x66bb6a, 0x0288d1, 0x00897b];
    const CORES_CSS = ['#1b5e20', '#2e7d32', '#43a047', '#66bb6a', '#0288d1', '#00897b'];

    let itemAtivoIdx = null;
    let meshesFatia = [];

    function lerDadosTabelaURL() {
      const params = new URLSearchParams(window.location.search);
      const raw = params.get('grafico');
      if (!raw) return null;

      try {
        const parsed = JSON.parse(raw);
        const lista = Array.isArray(parsed.i) ? parsed.i : (Array.isArray(parsed.itens) ? parsed.itens : []);
        return {
          titulo: parsed.t || parsed.titulo || 'Ranking 3D',
          tipo: parsed.tp || parsed.tipo || 'industria',
          itens: lista.map((it, idx) => ({
            pos: it.p ?? it.pos ?? (idx + 1),
            nome: it.n || it.nome || `Item ${idx + 1}`,
            score: Number(it.s ?? it.score ?? 0),
            valor: it.v || it.valorPrincipalFmt || '',
            detalhe: it.d || it.detalheExtra || '',
            distanciaKm: it.km ?? it.distanciaKm ?? '',
            avaliacao: it.av ?? it.avaliacao ?? ''
          }))
        };
      } catch (e) {
        console.error('Erro ao ler dados da tabela:', e);
        return null;
      }
    }

    function fecharEtiqueta() {
      itemAtivoIdx = null;
      document.getElementById('etiqueta-selecionada').style.display = 'none';
      document.getElementById('dica-toque').style.display = 'block';
      meshesFatia.forEach((m) => {
        m.position.x = m.userData.baseX;
        m.position.z = m.userData.baseZ;
      });
    }

    function mostrarEtiquetaItem(item, idx, tipo) {
      itemAtivoIdx = idx;
      const corCss = CORES_CSS[idx % CORES_CSS.length];
      const box = document.getElementById('etiqueta-selecionada');
      const linhasEl = document.getElementById('etq-linhas');

      box.style.borderTopColor = corCss;
      box.style.display = 'block';
      document.getElementById('dica-toque').style.display = 'none';

      document.getElementById('etq-pos').innerText = `Posição #${item.pos ?? (idx + 1)} • ${tipo === 'cooperativa' ? 'Cooperativa' : 'Fornecedor'}`;
      document.getElementById('etq-score').innerText = `${item.score} pts`;
      document.getElementById('etq-nome').innerText = item.nome;

      const linhas = [];
      if (item.valor) {
        const rotuloValor = tipo === 'cooperativa' ? 'Custo Total Estimado' : 'Orçamento / Valor';
        linhas.push(`<div class="etiqueta-linha-destaque">${rotuloValor}: ${item.valor}</div>`);
      }
      if (item.detalhe) {
        linhas.push(`<div>${item.detalhe}</div>`);
      }
      if (item.distanciaKm !== '' && item.distanciaKm !== null && item.distanciaKm !== undefined) {
        linhas.push(`<div>Distância: <strong>${item.distanciaKm} km</strong></div>`);
      }
      if (tipo !== 'cooperativa' && item.avaliacao !== '' && item.avaliacao !== null && item.avaliacao !== undefined) {
        linhas.push(`<div>Avaliação: <strong>⭐ ${item.avaliacao}</strong></div>`);
      }

      linhasEl.innerHTML = linhas.length ? linhas.join('') : `<div>Pontuação no ranking: <strong>${item.score} pts</strong></div>`;

      meshesFatia.forEach((m, mIdx) => {
        const destaque = mIdx === idx ? 0.24 : 0;
        m.position.x = m.userData.baseX + Math.cos(m.userData.anguloMeio) * destaque;
        m.position.z = m.userData.baseZ + Math.sin(m.userData.anguloMeio) * destaque;
      });
    }

    function iniciarGrafico3D(itens, tipo) {
      const canvas = document.getElementById('canvas-3d');
      const scene = new THREE.Scene();

      const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
      const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
      renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));

      function ajustarProporcaoTela() {
        const w = window.innerWidth;
        const h = window.innerHeight;
        const ehCelular = w < 640;

        camera.aspect = w / h;
        camera.updateProjectionMatrix();
        renderer.setSize(w, h);

        if (ehCelular) {
          camera.position.set(0, 5.1, 7.2);
        } else {
          camera.position.set(0, 4.2, 5.8);
        }
        camera.lookAt(0, -0.1, 0);
      }

      ajustarProporcaoTela();

      scene.add(new THREE.AmbientLight(0xffffff, 0.85));
      const luzDirecional = new THREE.DirectionalLight(0xffffff, 0.85);
      luzDirecional.position.set(4, 7, 5);
      scene.add(luzDirecional);

      const grupoPizza = new THREE.Group();
      scene.add(grupoPizza);

      const total = itens.reduce((acc, it) => acc + Math.max(Number(it.score) || 0, 0.1), 0);
      let anguloAtual = 0;
      const raio = 1.75;
      meshesFatia = [];

      itens.forEach((item, idx) => {
        const valorPos = Math.max(Number(item.score) || 0, 0.1);
        const anguloFatia = (valorPos / total) * Math.PI * 2;
        const corHex = CORES_3D[idx % CORES_3D.length];

        const forma = new THREE.Shape();
        forma.moveTo(0, 0);
        forma.absarc(0, 0, raio, anguloAtual, anguloAtual + anguloFatia, false);
        forma.lineTo(0, 0);

        const geo = new THREE.ExtrudeGeometry(forma, {
          depth: 0.58,
          bevelEnabled: true,
          bevelSegments: 2,
          steps: 1,
          bevelSize: 0.025,
          bevelThickness: 0.025
        });
        geo.rotateX(-Math.PI / 2);

        const mat = new THREE.MeshStandardMaterial({
          color: corHex,
          roughness: 0.35,
          metalness: 0.15
        });

        const fatiaMesh = new THREE.Mesh(geo, mat);
        const anguloMeio = anguloAtual + anguloFatia / 2;
        const baseX = Math.cos(anguloMeio) * 0.05;
        const baseZ = Math.sin(anguloMeio) * 0.05;

        fatiaMesh.position.x = baseX;
        fatiaMesh.position.z = baseZ;
        fatiaMesh.userData = { item, idx, baseX, baseZ, anguloMeio };

        grupoPizza.add(fatiaMesh);
        meshesFatia.push(fatiaMesh);

        anguloAtual += anguloFatia;
      });

      const raycaster = new THREE.Raycaster();
      const ponteiro = new THREE.Vector2();

      let arrastando = false;
      let moveuDuranteArraste = false;
      let inicioX = 0;
      let inicioY = 0;
      let ultimoX = 0;
      let ultimoY = 0;

      canvas.addEventListener('pointerdown', (e) => {
        arrastando = true;
        moveuDuranteArraste = false;
        inicioX = ultimoX = e.clientX;
        inicioY = ultimoY = e.clientY;
      });

      window.addEventListener('pointermove', (e) => {
        if (!arrastando) return;
        const dx = e.clientX - ultimoX;
        const dy = e.clientY - ultimoY;
        if (Math.hypot(e.clientX - inicioX, e.clientY - inicioY) > 6) {
          moveuDuranteArraste = true;
        }
        ultimoX = e.clientX;
        ultimoY = e.clientY;

        grupoPizza.rotation.y += dx * 0.01;
        grupoPizza.rotation.x = Math.max(-0.45, Math.min(0.55, grupoPizza.rotation.x + dy * 0.008));
      });

      window.addEventListener('pointerup', (e) => {
        if (!arrastando) return;
        arrastando = false;

        if (!moveuDuranteArraste) {
          const rect = canvas.getBoundingClientRect();
          ponteiro.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
          ponteiro.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;

          raycaster.setFromCamera(ponteiro, camera);
          const hits = raycaster.intersectObjects(meshesFatia, false);

          if (hits.length > 0) {
            const clicado = hits[0].object.userData;
            mostrarEtiquetaItem(clicado.item, clicado.idx, tipo);
          } else {
            fecharEtiqueta();
          }
        }
      });

      window.addEventListener('resize', ajustarProporcaoTela);

      function animar() {
        requestAnimationFrame(animar);
        if (!arrastando && itemAtivoIdx === null) {
          grupoPizza.rotation.y += 0.005;
        }
        renderer.render(scene, camera);
      }
      animar();
    }

    window.addEventListener('DOMContentLoaded', () => {
      const dados = lerDadosTabelaURL();
      if (!dados || !dados.itens.length) {
        document.getElementById('aviso-vazio').style.display = 'block';
        document.getElementById('dica-toque').style.display = 'none';
        return;
      }

      const ordenados = [...dados.itens].sort((a, b) => Number(b.score) - Number(a.score));
      document.getElementById('titulo-grafico').innerText = dados.titulo;
      document.getElementById('subtitulo-grafico').innerText =
        dados.tipo === 'cooperativa' ? 'Cooperativas • Conforme a tabela' : 'Fornecedores • Conforme a tabela';

      iniciarGrafico3D(ordenados, dados.tipo);
    });
  </script>
</body>
</html>
