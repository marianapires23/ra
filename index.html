<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Circularis • Gráfico do Ranking</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; }
    body {
      min-height: 100vh;
      background: #0b2920;
      color: #ffffff;
      padding: 24px 16px 48px;
      display: flex;
      justify-content: center;
    }
    .container {
      width: 100%;
      max-width: 720px;
    }
    .header-card {
      background: #b6d8bd;
      color: #071f18;
      border-radius: 14px;
      padding: 20px 22px;
      margin-bottom: 18px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.2);
    }
    .header-card h1 {
      font-size: 1.45rem;
      font-weight: 800;
      margin-bottom: 4px;
    }
    .header-card p {
      font-size: 0.88rem;
      color: #1e4537;
      font-weight: 600;
    }
    .card {
      background: #ffffff;
      color: #071f18;
      border-radius: 14px;
      padding: 22px;
      margin-bottom: 18px;
      box-shadow: 0 10px 26px rgba(0,0,0,0.25);
    }
    .card h2 {
      font-size: 1.05rem;
      font-weight: 800;
      margin-bottom: 14px;
      color: #0b5134;
    }
    .chart-box {
      width: 280px;
      height: 280px;
      max-width: 100%;
      margin: 0 auto;
      position: relative;
    }
    .item-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .item-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      padding: 12px 14px;
      border-radius: 10px;
      border: 1px solid #e2e8f0;
      background: #f8fafc;
    }
    .item-row.lider {
      background: #f0fdf4;
      border-color: #86efac;
    }
    .dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    .item-info {
      flex: 1;
    }
    .item-nome {
      font-weight: 800;
      font-size: 0.95rem;
      color: #071f18;
    }
    .item-detalhe {
      font-size: 0.78rem;
      color: #475569;
      margin-top: 2px;
    }
    .item-score-box {
      text-align: right;
      flex-shrink: 0;
    }
    .score-badge {
      display: inline-block;
      background: #e8f5e9;
      color: #1b4d3e;
      font-weight: 800;
      font-size: 0.85rem;
      padding: 4px 10px;
      border-radius: 6px;
    }
    .valor-texto {
      font-size: 0.82rem;
      font-weight: 700;
      color: #15803d;
      margin-top: 4px;
    }
    .vazio {
      text-align: center;
      padding: 24px 12px;
      color: #475569;
      font-size: 0.92rem;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header-card">
      <h1 id="titulo-pagina">Gráfico de Desempenho</h1>
      <p id="subtitulo-pagina">Dados sincronizados com a tabela de métricas</p>
    </div>

    <div class="card">
      <h2>📊 Gráfico de Pizza (Score)</h2>
      <div class="chart-box">
        <canvas id="graficoPizzaRA"></canvas>
      </div>
      <div id="mensagem-vazia" class="vazio" style="display:none;">
        Nenhum dado de tabela foi recebido neste QR Code. Gere o QR Code novamente pela tela de Métricas.
      </div>
    </div>

    <div class="card" id="card-detalhes" style="display:none;">
      <h2>📋 Resumo Conforme a Tabela</h2>
      <div id="lista-detalhes" class="item-list"></div>
    </div>
  </div>

  <script>
    const CORES_PADRAO = ['#0d231a', '#1b4d3e', '#2e7d32', '#52a368', '#0288d1', '#0f766e'];

    function decodificarBase64URL(str) {
      let base64 = str.replace(/-/g, '+').replace(/_/g, '/');
      while (base64.length % 4) base64 += '=';
      const bin = atob(base64);
      const bytes = new Uint8Array(bin.length);
      for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
      return new TextDecoder().decode(bytes);
    }

    function obterDadosDaURL() {
      const params = new URLSearchParams(window.location.search);

      const rawGrafico = params.get('grafico');
      if (rawGrafico) {
        try {
          const parsed = JSON.parse(decodeURIComponent(rawGrafico));
          const itens = Array.isArray(parsed.i) ? parsed.i : [];
          return {
            titulo: parsed.t || 'Ranking',
            tipo: parsed.tp || 'industria',
            itens: itens.map((it, idx) => ({
              pos: it.p ?? (idx + 1),
              nome: it.n || `Item ${idx + 1}`,
              score: Number(it.s ?? 0),
              valor: it.v || '',
              detalhe: it.d || ''
            }))
          };
        } catch (e) {
          console.error('Erro ao ler parâmetro ?grafico=:', e);
        }
      }

      const hash = window.location.hash || '';
      const match = hash.match(/dados=([^&]+)/);
      if (match && match[1]) {
        try {
          const decoded = JSON.parse(decodificarBase64URL(decodeURIComponent(match[1])));
          const itens = Array.isArray(decoded.itens) ? decoded.itens : [];
          return {
            titulo: decoded.titulo || 'Ranking',
            tipo: decoded.tipo || 'industria',
            itens: itens.map((it, idx) => ({
              pos: it.pos ?? (idx + 1),
              nome: it.nome || `Item ${idx + 1}`,
              score: Number(it.score ?? 0),
              valor: it.valorPrincipalFmt || '',
              detalhe: it.detalheExtra || ''
            }))
          };
        } catch (e) {
          console.error('Erro ao ler #dados=:', e);
        }
      }

      return null;
    }

    window.addEventListener('DOMContentLoaded', () => {
      const dados = obterDadosDaURL();
      const tituloEl = document.getElementById('titulo-pagina');
      const subtituloEl = document.getElementById('subtitulo-pagina');
      const vazioEl = document.getElementById('mensagem-vazia');
      const cardDetalhes = document.getElementById('card-detalhes');
      const listaDetalhes = document.getElementById('lista-detalhes');

      if (!dados || !Array.isArray(dados.itens) || dados.itens.length === 0) {
        vazioEl.style.display = 'block';
        return;
      }

      const ordenados = [...dados.itens].sort((a, b) => Number(b.score) - Number(a.score));

      tituloEl.innerText = dados.titulo || 'Gráfico de Desempenho';
      subtituloEl.innerText = dados.tipo === 'cooperativa'
        ? 'Comparativo de Cooperativas de Coleta conforme a tabela'
        : 'Ranking de Fornecedores conforme a tabela';

      const labels = ordenados.map((item, idx) => `#${item.pos ?? (idx + 1)} ${item.nome}`);
      const scores = ordenados.map(item => Number(item.score) || 0);
      const cores = ordenados.map((_, idx) => CORES_PADRAO[idx % CORES_PADRAO.length]);

      const ctx = document.getElementById('graficoPizzaRA').getContext('2d');
      new Chart(ctx, {
        type: 'pie',
        data: {
          labels,
          datasets: [{
            data: scores,
            backgroundColor: cores
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: {
            legend: { position: 'bottom', labels: { font: { size: 11 } } },
            tooltip: {
              callbacks: {
                label: function(context) {
                  const item = ordenados[context.dataIndex];
                  const extraValor = item && item.valor ? ` • ${item.valor}` : '';
                  return ` ${context.label}: ${context.raw} pts${extraValor}`;
                }
              }
            }
          }
        }
      });

      cardDetalhes.style.display = 'block';
      listaDetalhes.innerHTML = ordenados.map((item, idx) => `
        <div class="item-row ${idx === 0 ? 'lider' : ''}">
          <span class="dot" style="background:${cores[idx]}"></span>
          <div class="item-info">
            <div class="item-nome">#${item.pos ?? (idx + 1)} • ${item.nome}</div>
            ${item.detalhe ? `<div class="item-detalhe">${item.detalhe}</div>` : ''}
          </div>
          <div class="item-score-box">
            <span class="score-badge">${item.score} pts</span>
            ${item.valor ? `<div class="valor-texto">${item.valor}</div>` : ''}
          </div>
        </div>
      `).join('');
    });
  </script>
</body>
</html>
