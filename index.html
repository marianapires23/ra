<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Circularis • Gráfico 3D</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; }

    html, body {
      height: 100dvh;
      width: 100%;
      background: #0b2920;
      color: #ffffff;
      overflow: hidden;
    }

    .tela-3d {
      position: relative;
      width: 100%;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: clamp(12px, 3vw, 24px);
    }

    #canvas-3d {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100dvh;
      display: block;
      z-index: 1;
      touch-action: none;
      cursor: grab;
    }

    #canvas-3d:active {
      cursor: grabbing;
    }

    .topo-limpo {
      position: relative;
      z-index: 2;
      align-self: flex-start;
      max-width: min(92vw, 420px);
      background: rgba(255, 255, 255, 0.94);
      color: #071f18;
      padding: 10px 14px;
      border-radius: 12px;
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.22);
    }

    .topo-limpo h1 {
      font-size: clamp(0.95rem, 3.8vw, 1.15rem);
      font-weight: 800;
      line-height: 1.25;
      color: #071f18;
    }

    .topo-limpo p {
      font-size: clamp(0.72rem, 2.8vw, 0.8rem);
      color: #2e7d32;
      font-weight: 700;
      margin-top: 2px;
    }

    .faixa-etiquetas {
      position: relative;
      z-index: 2;
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 4px;
      scrollbar-width: thin;
      -webkit-overflow-scrolling: touch;
    }

    .etiqueta-item {
      flex: 0 0 auto;
      width: clamp(165px, 44vw, 210px);
      background: rgba(255, 255, 255, 0.95);
      color: #071f18;
      border-radius: 10px;
      padding: 9px 11px;
      border-left: 4px solid #2e7d32;
      box-shadow: 0 6px 16px rgba(0, 0, 0, 0.22);
    }

    .etiqueta-cabecalho {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.7rem;
      font-weight: 800;
      color: #0f4033;
      margin-bottom: 2px;
    }

    .etiqueta-pts {
      background: #e8f5e9;
      color: #1b5e20;
      padding: 1px 6px;
      border-radius: 5px;
    }

    .etiqueta-nome {
      font-size: clamp(0.8rem, 3.2vw, 0.88rem);
      font-weight: 800;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .etiqueta-sub {
      font-size: 0.7rem;
      color: #374151;
      font-weight: 600;
      margin-top: 2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .aviso-vazio {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 5;
      width: min(88vw, 340px);
      background: rgba(255, 255, 255, 0.96);
      color: #071f18;
      padding: 18px;
      border-radius: 12px;
      text-align: center;
      font-size: 0.85rem;
      font-weight: 600;
      display: none;
    }
  </style>
</head>
<body>
  <canvas id="canvas-3d"></canvas>

  <div class="tela-3d">
    <header class="topo-limpo">
      <h1 id="titulo-grafico">Gráfico 3D</h1>
      <p id="subtitulo-grafico">Arraste para girar • Dados da tabela</p>
    </header>

    <section id="faixa-etiquetas" class="faixa-etiquetas"></section>
  </div>

  <div id="aviso-vazio" class="aviso-vazio">
    Nenhum dado recebido pelo QR Code. Gere o QR Code na tela de Métricas.
  </div>

  <script>
    const CORES_3D = [0x1b5e20, 0x2e7d32, 0x43a047, 0x66bb6a, 0x0288d1, 0x00897b];
    const CORES_BORDA = ['#1b5e20', '#2e7d32', '#43a047', '#66bb6a', '#0288d1', '#00897b'];

    function lerDadosTabelaURL() {
      const params = new URLSearchParams(window.location.search);
      const raw = params.get('grafico');
      if (!raw) return null;

      try {
        const parsed = JSON.parse(raw);
        const lista = Array.isArray(parsed.i) ? parsed.i : (Array.isArray(parsed.itens) ? parsed.itens : []);
        return {
          titulo: parsed.t || parsed.titulo || 'Ranking 3D',
          tipo: parsed.tp || parsed.tipo || 'industria',
          itens: lista.map((it, idx) => ({
            pos: it.p ?? it.pos ?? (idx + 1),
            nome: it.n || it.nome || `Item ${idx + 1}`,
            score: Number(it.s ?? it.score ?? 0),
            valor: it.v || it.valorPrincipalFmt || '',
            detalhe: it.d || it.detalheExtra || ''
          }))
        };
      } catch (e) {
        console.error('Erro ao ler dados da tabela:', e);
        return null;
      }
    }

    function criarSpriteEtiqueta(linha1, linha2, corBorda) {
      const canvas = document.createElement('canvas');
      canvas.width = 440;
      canvas.height = 132;
      const ctx = canvas.getContext('2d');

      ctx.fillStyle = 'rgba(255, 255, 255, 0.94)';
      ctx.beginPath();
      ctx.roundRect(8, 8, 424, 116, 18);
      ctx.fill();

      ctx.lineWidth = 5;
      ctx.strokeStyle = corBorda;
      ctx.stroke();

      ctx.fillStyle = '#071f18';
      ctx.font = 'bold 28px Arial';
      ctx.fillText(linha1.slice(0, 20), 22, 52);

      ctx.fillStyle = '#1b5e20';
      ctx.font = 'bold 23px Arial';
      ctx.fillText(linha2.slice(0, 24), 22, 94);

      const textura = new THREE.CanvasTexture(canvas);
      const material = new THREE.SpriteMaterial({ map: textura, transparent: true });
      const sprite = new THREE.Sprite(material);
      return sprite;
    }

    function renderizarEtiquetasInferiores(itens) {
      const container = document.getElementById('faixa-etiquetas');
      container.innerHTML = itens.map((item, idx) => {
        const cor = CORES_BORDA[idx % CORES_BORDA.length];
        const sub = item.valor || item.detalhe || `${item.score} pontos`;
        return `
          <div class="etiqueta-item" style="border-left-color:${cor};">
            <div class="etiqueta-cabecalho">
              <span>#${item.pos ?? (idx + 1)}</span>
              <span class="etiqueta-pts">${item.score} pts</span>
            </div>
            <div class="etiqueta-nome">${item.nome}</div>
            <div class="etiqueta-sub">${sub}</div>
          </div>
        `;
      }).join('');
    }

    function iniciarGrafico3D(itens) {
      const canvas = document.getElementById('canvas-3d');
      const scene = new THREE.Scene();

      const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
      const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
      renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));

      function ajustarProporcaoTela() {
        const w = window.innerWidth;
        const h = window.innerHeight;
        const ehCelular = w < 640;

        camera.aspect = w / h;
        camera.updateProjectionMatrix();
        renderer.setSize(w, h);

        if (ehCelular) {
          camera.position.set(0, 5.2, 7.6);
        } else {
          camera.position.set(0, 4.2, 5.8);
        }
        camera.lookAt(0, -0.1, 0);
      }

      ajustarProporcaoTela();

      scene.add(new THREE.AmbientLight(0xffffff, 0.85));
      const luzDirecional = new THREE.DirectionalLight(0xffffff, 0.85);
      luzDirecional.position.set(4, 7, 5);
      scene.add(luzDirecional);

      const grupoPizza = new THREE.Group();
      scene.add(grupoPizza);

      const total = itens.reduce((acc, it) => acc + Math.max(Number(it.score) || 0, 0.1), 0);
      let anguloAtual = 0;
      const raio = 1.65;
      const sprites = [];

      itens.forEach((item, idx) => {
        const valorPos = Math.max(Number(item.score) || 0, 0.1);
        const anguloFatia = (valorPos / total) * Math.PI * 2;
        const corHex = CORES_3D[idx % CORES_3D.length];
        const corBorda = CORES_BORDA[idx % CORES_BORDA.length];

        const forma = new THREE.Shape();
        forma.moveTo(0, 0);
        forma.absarc(0, 0, raio, anguloAtual, anguloAtual + anguloFatia, false);
        forma.lineTo(0, 0);

        const geo = new THREE.ExtrudeGeometry(forma, {
          depth: 0.55,
          bevelEnabled: true,
          bevelSegments: 2,
          steps: 1,
          bevelSize: 0.025,
          bevelThickness: 0.025
        });
        geo.rotateX(-Math.PI / 2);

        const mat = new THREE.MeshStandardMaterial({
          color: corHex,
          roughness: 0.35,
          metalness: 0.15
        });

        const fatiaMesh = new THREE.Mesh(geo, mat);
        const anguloMeio = anguloAtual + anguloFatia / 2;
        const afastamento = idx === 0 ? 0.16 : 0.05;
        fatiaMesh.position.x = Math.cos(anguloMeio) * afastamento;
        fatiaMesh.position.z = Math.sin(anguloMeio) * afastamento;
        grupoPizza.add(fatiaMesh);

        const sprite = criarSpriteEtiqueta(
          `#${item.pos ?? (idx + 1)} ${item.nome}`,
          `${item.score} pts${item.valor ? ' • ' + item.valor : ''}`,
          corBorda
        );
        const ehCelular = window.innerWidth < 640;
        sprite.scale.set(ehCelular ? 2.15 : 2.35, ehCelular ? 0.65 : 0.7, 1);
        sprite.position.set(
          Math.cos(anguloMeio) * (raio + 0.85),
          0.9 + (idx % 2) * 0.25,
          Math.sin(anguloMeio) * (raio + 0.85)
        );
        grupoPizza.add(sprite);
        sprites.push(sprite);

        anguloAtual += anguloFatia;
      });

      let arrastando = false;
      let ultimoX = 0;
      let ultimoY = 0;

      canvas.addEventListener('pointerdown', (e) => {
        arrastando = true;
        ultimoX = e.clientX;
        ultimoY = e.clientY;
      });

      window.addEventListener('pointerup', () => {
        arrastando = false;
      });

      window.addEventListener('pointermove', (e) => {
        if (!arrastando) return;
        grupoPizza.rotation.y += (e.clientX - ultimoX) * 0.01;
        grupoPizza.rotation.x = Math.max(-0.45, Math.min(0.55, grupoPizza.rotation.x + (e.clientY - ultimoY) * 0.008));
        ultimoX = e.clientX;
        ultimoY = e.clientY;
      });

      window.addEventListener('resize', () => {
        ajustarProporcaoTela();
        const ehCelular = window.innerWidth < 640;
        sprites.forEach((sp) => {
          sp.scale.set(ehCelular ? 2.15 : 2.35, ehCelular ? 0.65 : 0.7, 1);
        });
      });

      function animar() {
        requestAnimationFrame(animar);
        if (!arrastando) {
          grupoPizza.rotation.y += 0.005;
        }
        renderer.render(scene, camera);
      }
      animar();
    }

    window.addEventListener('DOMContentLoaded', () => {
      const dados = lerDadosTabelaURL();
      if (!dados || !dados.itens.length) {
        document.getElementById('aviso-vazio').style.display = 'block';
        return;
      }

      const ordenados = [...dados.itens].sort((a, b) => Number(b.score) - Number(a.score));
      document.getElementById('titulo-grafico').innerText = dados.titulo;
      document.getElementById('subtitulo-grafico').innerText =
        dados.tipo === 'cooperativa' ? 'Cooperativas • Conforme a tabela' : 'Fornecedores • Conforme a tabela';

      iniciarGrafico3D(ordenados);
      renderizarEtiquetasInferiores(ordenados);
    });
  </script>
</body>
</html>
